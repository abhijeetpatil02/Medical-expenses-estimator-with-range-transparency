<!--
Hospital Cost Estimator - Main User Dashboard (index.html)
=========================================================
This dashboard is the primary tool interface. It features:
1. Fuzzy search input fields with dynamic autocomplete suggestion dropdowns.
2. Search suggestion list rendering and keyboard arrow key navigation (ArrowUp, ArrowDown, Enter, Escape).
3. Visual estimation compare card templates dynamically populated by the backend JSON responses.
4. "Range Transparency" visualization bar meters showing where the average cost sits relative to the minimum and maximum boundaries.
5. Action hooks for immediate hospital communications (tel dialers) and localization navigation (Google Maps links).
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Cost Predictor - Dashboard</title>
    <!-- Outfit Font Family fromm Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Main pagee styles layout (style.css) -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="dashboard-container">
        <!-- Top Navigation bar containing Logout and Theme buttons -->
        <div class="top-nav">
            <!-- Theme Toggle Button -->
            <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle Theme">
                <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" style="display: none;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 3v1m0 16v1m9-9h-1M4 9H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M14 12a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>

            <!-- Redirection trigger to session termination route -->
            <a href="/logout" class="logout-btn">
                <svg xmlns="http://www.w3.org/2000/svg" class="logout-icon" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                <span>Logout</span>
            </a>
        </div>

        <header class="header">
            <div class="logo-wrapper">
                <img src="logo.png" alt="Logo" class="app-logo">
            </div>
            <h1>Medical Expenses Estimator</h1>
        </header>

        <!-- Form entry card containing inputs for autocomplete fields -->
        <div class="card search-card">
            <form id="predictForm">
                <!-- Disease Input -->
                <div class="input-group">
                    <label for="disease">Disease Name</label>
                    <div class="autocomplete-container">
                        <input type="text" id="disease" placeholder="e.g. Fever, Malaria, Heart Disease" required
                            autocomplete="off">
                        <!-- Autocomplete Suggestions Dropdown List -->
                        <ul id="diseaseSuggestions" class="suggestions-list"></ul>
                    </div>
                </div>

                <!-- City Input -->
                <div class="input-group">
                    <label for="city">City Name</label>
                    <div class="autocomplete-container">
                        <input type="text" id="city" placeholder="e.g. Mangaluru, Surathkal, Bantwal" required
                            autocomplete="off">
                        <!-- Autocomplete Suggestions Dropdown List -->
                        <ul id="citySuggestions" class="suggestions-list"></ul>
                    </div>
                </div>

                <!-- Submission Compare Trigger -->
                <button type="submit" id="submitBtn" class="submit-btn">
                    <span>Estimate & Compare</span>
                    <!-- Spinner loading wheel, hidden by default -->
                    <div class="spinner-btn" id="submitSpinner"></div>
                    <svg xmlns="http://www.w3.org/2000/svg" class="btn-icon" id="submitIcon" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                            d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </button>
            </form>
        </div>

        <!-- System Error alert notices container -->
        <div id="errorMessage" class="error-message"></div>

        <!-- Dynamic Results injection wrapper -->
        <div id="resultsWrapper" class="results-wrapper"></div>
    </div>

    <!-- Interface Controller Scripts -->
    <script>
        // =====================================================================
        // Theme Toggle Manager
        // =====================================================================
        const themeToggleBtn = document.getElementById('themeToggle');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');

        // Check local preferences on document load
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-theme');
            sunIcon.style.display = 'block';
            moonIcon.style.display = 'none';
        } else {
            document.body.classList.remove('dark-theme');
            sunIcon.style.display = 'none';
            moonIcon.style.display = 'block';
        }

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            if (isDark) {
                sunIcon.style.display = 'block';
                moonIcon.style.display = 'none';
            } else {
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
            }
        });

        // =====================================================================
        // Autocomplete & Query Suggestion Lists Manager
        // =====================================================================
        let suggestionsData = { diseases: [], cities: [] };
        let latestPredictionData = null; // Store predicted details globally for download options

        // Pull category indices from backend route to feed suggestion dropdown lists
        async function fetchSuggestions() {
            try {
                const response = await fetch('/api/suggestions');
                if (response.ok) {
                    suggestionsData = await response.json();
                    // Connect suggestions arrays to matching DOM inputs
                    setupAutocomplete("disease", "diseaseSuggestions", suggestionsData.diseases);
                    setupAutocomplete("city", "citySuggestions", suggestionsData.cities);
                }
            } catch (err) {
                console.error("Error fetching search suggestions list: ", err);
            }
        }

        function setupAutocomplete(inputId, listId, dataList) {
            const input = document.getElementById(inputId);
            const list = document.getElementById(listId);
            let activeIndex = -1; // Tracks current highlight keyboard index for user selection

            // Renders match outputs inside the list box
            function renderSuggestions(matches) {
                list.innerHTML = "";
                if (matches.length === 0) {
                    list.style.display = "none";
                    return;
                }

                matches.forEach((item, index) => {
                    const li = document.createElement("li");
                    li.textContent = item;
                    // Mouse selection handling
                    li.addEventListener("mousedown", (e) => {
                        e.preventDefault(); // Prevents loss of input focus triggers prior to clicks
                        input.value = item;
                        list.style.display = "none";
                        activeIndex = -1;
                    });
                    list.appendChild(li);
                });
                list.style.display = "block";
            }

            // Filters lookup arrays matching user entry characters
            function filterMatches() {
                const query = input.value.trim().toLowerCase();
                if (!query) {
                    list.style.display = "none";
                    activeIndex = -1;
                    return;
                }
                // Fetch up to 8 matched values
                const matches = dataList.filter(item => item.toLowerCase().includes(query)).slice(0, 8);
                renderSuggestions(matches);
                activeIndex = -1;
            }

            // Key interaction and blur hooks
            input.addEventListener("input", filterMatches);
            input.addEventListener("focus", filterMatches);

            // Close suggestion list box when focus is lost
            input.addEventListener("blur", () => {
                setTimeout(() => {
                    list.style.display = "none";
                }, 150);
            });

            // Keyboard navigation listener (ArrowUp, ArrowDown, Enter, Escape)
            input.addEventListener("keydown", (e) => {
                const items = list.querySelectorAll("li");
                if (list.style.display === "block" && items.length > 0) {
                    if (e.key === "ArrowDown") {
                        e.preventDefault();
                        activeIndex = (activeIndex + 1) % items.length;
                        setActive(items);
                    } else if (e.key === "ArrowUp") {
                        e.preventDefault();
                        activeIndex = (activeIndex - 1 + items.length) % items.length;
                        setActive(items);
                    } else if (e.key === "Enter") {
                        if (activeIndex > -1) {
                            e.preventDefault();
                            input.value = items[activeIndex].textContent;
                            list.style.display = "none";
                            activeIndex = -1;
                        }
                    } else if (e.key === "Escape") {
                        list.style.display = "none";
                        activeIndex = -1;
                    }
                }
            });

            // Add highlight visibility class to active list element
            function setActive(items) {
                items.forEach(el => el.classList.remove("active"));
                if (activeIndex > -1 && items[activeIndex]) {
                    items[activeIndex].classList.add("active");
                    items[activeIndex].scrollIntoView({ block: "nearest" });
                }
            }
        }

        // Initialize autocompletes when DOM completes loading
        window.addEventListener("DOMContentLoaded", fetchSuggestions);

        // =====================================================================
        // Accordion Section Toggle Drawer (Hospital Details)
        // =====================================================================
        window.toggleDetailsAccordion = function (id) {
            const accordionContent = document.getElementById(id);
            if (accordionContent) {
                accordionContent.classList.toggle('expanded');
            }
        };

        // =====================================================================
        // Prediction Submission Controller
        // =====================================================================
        document.getElementById("predictForm").addEventListener("submit", async function (e) {
            e.preventDefault(); // Stop standard form navigation

            const disease = document.getElementById("disease").value.trim();
            const city = document.getElementById("city").value.trim();
            const resultsWrapper = document.getElementById("resultsWrapper");
            const errorMessage = document.getElementById("errorMessage");

            const submitBtn = document.getElementById("submitBtn");
            const submitSpinner = document.getElementById("submitSpinner");
            const submitIcon = document.getElementById("submitIcon");

            // UI enter loading state
            submitBtn.disabled = true;
            submitSpinner.style.display = "block";
            submitIcon.style.display = "none";

            // Inject temporary HTML skeleton shimmers to convey estimation activity to user
            errorMessage.style.display = "none";
            resultsWrapper.style.display = "grid";
            resultsWrapper.innerHTML = `
                <div class="city-info-banner">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                    </svg>
                    <span>Estimating healthcare costs, please wait...</span>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-shimmer"></div>
                    <div class="skeleton-badge"></div>
                    <div class="skeleton-title"></div>
                    <div class="skeleton-price-box"></div>
                    <div class="skeleton-line"></div>
                    <div class="skeleton-line short"></div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-shimmer"></div>
                    <div class="skeleton-badge"></div>
                    <div class="skeleton-title"></div>
                    <div class="skeleton-price-box"></div>
                    <div class="skeleton-line"></div>
                    <div class="skeleton-line short"></div>
                </div>
            `;

            try {
                // Submit inputs to predictive estimator API route
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ disease, city })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "An error occurred. Please verify inputs and try again.");
                }

                // Save data to global variable for download hooks
                latestPredictionData = data;

                // Render matching comparison banner with download action buttons
                let htmlContent = `
                    <div class="city-info-banner">
                        <div class="banner-title">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                            <span>Comparison for <strong>${data.disease}</strong> in <strong>${data.city}</strong></span>
                        </div>
                        <div class="banner-actions">
                            <button type="button" onclick="downloadPDF()" class="download-btn pdf-btn" title="Download PDF Report">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                </svg>
                                <span>Download PDF</span>
                            </button>
                            <button type="button" onclick="downloadCSV()" class="download-btn csv-btn" title="Download CSV Spreadsheet">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m-9-4h18M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                </svg>
                                <span>Download CSV</span>
                            </button>
                        </div>
                    </div>
                `;

                // If fuzzy spelling match modified inputs, notify user of corrections
                if (data.original_disease && data.original_city) {
                    const diseaseCorrected = data.disease.toLowerCase() !== data.original_disease.toLowerCase().trim();
                    const cityCorrected = data.city.toLowerCase() !== data.original_city.toLowerCase().trim();

                    if (diseaseCorrected || cityCorrected) {
                        htmlContent += `
                            <div class="correction-notice-banner">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                                </svg>
                                <span>Showing results for: 
                                    ${diseaseCorrected ? `<strong>${data.disease}</strong> (corrected from "<em>${data.original_disease}</em>")` : `<strong>${data.disease}</strong>`} in 
                                    ${cityCorrected ? `<strong>${data.city}</strong> (corrected from "<em>${data.original_city}</em>")` : `<strong>${data.city}</strong>`}.
                                </span>
                            </div>
                        `;
                    }
                }

                // Loop and draw estimation cards
                if (data.predictions) {
                    const buildCard = (type, info, delayClass) => {
                        const predicted = info.predicted_cost;
                        const min = info.min_cost || Math.round(predicted * 0.8);
                        const max = info.max_cost || Math.round(predicted * 1.25);

                        // Calculate offset percentage positioning for visual indicator line
                        const rangeWidth = max - min;
                        const positionPct = rangeWidth > 0 ? ((predicted - min) / rangeWidth) * 100 : 50;

                        return `
                            <div class="hospital-card ${type} animate-card" ${delayClass ? `style="animation-delay: ${delayClass};"` : ''}>
                                <div class="card-header">
                                    <span class="badge">${type === 'govt' ? 'Government Hospital' : 'Private Hospital'}</span>
                                </div>
                                <h3 class="hospital-name">${info.hospital_name}</h3>
                                
                                <div class="cost-section">
                                    <div class="cost-label">Estimated Cost</div>
                                    <div class="cost-value-wrapper">
                                        <span class="cost-currency">₹</span>
                                        <span class="cost-value">${predicted.toLocaleString('en-IN')}</span>
                                    </div>
                                </div>

                                <!-- Range Transparency Visual Meter -->
                                <div class="range-container">
                                    <div class="range-bar-wrapper">
                                        <!-- Width filled up to the average predicted cost percentage -->
                                        <div class="range-bar-fill" style="left: 0; width: ${positionPct}%;"></div>
                                        <!-- Marker pointing to average value -->
                                        <div class="range-pointer" style="left: ${positionPct}%;">
                                            <div class="predicted-pointer-val">₹${predicted.toLocaleString('en-IN')}</div>
                                        </div>
                                    </div>
                                    <!-- Boundary labels layout -->
                                    <div class="range-labels">
                                        <span class="range-label-min">Min: <span class="range-label-val">₹${min.toLocaleString('en-IN')}</span></span>
                                        <span class="range-label-max">Max: <span class="range-label-val">₹${max.toLocaleString('en-IN')}</span></span>
                                    </div>
                                </div>

                                <!-- Accordion details list containing map coordinates and calling features -->
                                <div class="details-list">
                                    <div class="accordion-content" id="${type}-details-accordion">
                                        <div class="detail-item">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="detail-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                                            </svg>
                                            <div><strong>Type:</strong> ${info.hospital_type}</div>
                                        </div>
                                        <div class="detail-item">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="detail-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                                            </svg>
                                            <div><strong>Address:</strong> ${info.address}</div>
                                        </div>
                                        <div class="detail-item">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="detail-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.94.725l.548 2.2a1 1 0 01-.321.988l-1.305.98a10.582 10.582 0 004.872 4.872l.98-1.305a1 1 0 01.988-.321l2.2.548a1 1 0 01.725.94V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                                            </svg>
                                            <div><strong>Contact:</strong> ${info.contact}</div>
                                        </div>
                                        <!-- Action hooks panel -->
                                        <div class="action-buttons-group">
                                            <!-- Tel hook for mobile dialers -->
                                            ${info.contact !== 'N/A' && info.contact !== 'N/A' ? `
                                                <a href="tel:${info.contact.replace(/[^0-9-]/g, '')}" class="action-link-btn call-btn">
                                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.94.725l.548 2.2a1 1 0 01-.321.988l-1.305.98a10.582 10.582 0 004.872 4.872l.98-1.305a1 1 0 01.988-.321l2.2.548a1 1 0 01.725.94V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                                                    </svg>
                                                    Call Hospital
                                                </a>
                                            ` : ''}
                                            <!-- Maps hook query based on hospital name and address location -->
                                            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(info.hospital_name + ' ' + info.address)}" target="_blank" class="action-link-btn map-btn">
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
                                                </svg>
                                                Directions
                                            </a>
                                        </div>
                                    </div>
                                    <!-- Accordion control header toggle -->
                                    <div class="accordion-header" onclick="toggleDetailsAccordion('${type}-details-accordion')">
                                        <div class="accordion-title">
                                            <span>Hospital Details & Actions</span>
                                        </div>
                                        <svg xmlns="http://www.w3.org/2000/svg" class="accordion-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
                                        </svg>
                                    </div>
                                </div>
                            </div>
                        `;
                    };

                    // Draw cards sequentially
                    if (data.predictions.govt) {
                        htmlContent += buildCard('govt', data.predictions.govt, null);
                    }
                    if (data.predictions.private) {
                        htmlContent += buildCard('private', data.predictions.private, '0.1s');
                    }
                }

                resultsWrapper.innerHTML = htmlContent;
                // Scroll page smoothly down to the comparison outputs
                resultsWrapper.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            } catch (err) {
                resultsWrapper.style.display = "none";
                errorMessage.textContent = err.message;
                errorMessage.style.display = "block";
                errorMessage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } finally {
                // Exit loading state
                submitBtn.disabled = false;
                submitSpinner.style.display = "none";
                submitIcon.style.display = "block";
            }
        });

        // =====================================================================
        // Data Download Functions (CSV & PDF)
        // =====================================================================

        /**
         * Generates and downloads a CSV (Comma-Separated Values) spreadsheet containing prediction results.
         * This function runs entirely on the client side without making additional server requests.
         */
        window.downloadCSV = function () {
            // Step 1: Ensure that there is valid prediction data available to download
            if (!latestPredictionData || !latestPredictionData.predictions) {
                alert("No prediction data available to download.");
                return;
            }

            const data = latestPredictionData;
            const csvRows = [];

            // Step 2: Define the column headers for the spreadsheet
            csvRows.push(['Disease', 'City', 'Hospital Type', 'Recommended Hospital', 'Estimated Cost (INR)', 'Min Cost (INR)', 'Max Cost (INR)', 'Address', 'Contact'].join(','));

            // Step 3: Iterate through predictions (both Govt and Private) to create rows
            for (const [key, info] of Object.entries(data.predictions)) {
                // We wrap strings in double quotes and replace any existing double quotes with escaped quotes ("")
                // to prevent format corruption if the address contains commas or quotes.
                const row = [
                    `"${data.disease.replace(/"/g, '""')}"`,
                    `"${data.city.replace(/"/g, '""')}"`,
                    `"${info.hospital_type.replace(/"/g, '""')}"`,
                    `"${info.hospital_name.replace(/"/g, '""')}"`,
                    info.predicted_cost,
                    info.min_cost,
                    info.max_cost,
                    `"${info.address.replace(/"/g, '""')}"`,
                    `"${info.contact.replace(/"/g, '""')}"`
                ];
                // Combine cells in this row using a comma and add to our rows list
                csvRows.push(row.join(','));
            }

            // Step 4: Convert the rows array into a single multiline string
            const csvContent = csvRows.join("\n");

            // Step 5: Create a raw data Blob of type 'text/csv' from the string
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });

            // Step 6: Create a temporary URL pointing to the Blob object in browser memory
            const url = URL.createObjectURL(blob);

            // Step 7: Create a temporary virtual anchor (<a>) element to trigger download
            const link = document.createElement("a");
