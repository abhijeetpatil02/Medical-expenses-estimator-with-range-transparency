<!-- 
Hospital Cost Estimator - Landing and Authentication Page (auth.html)
====================================================================
This page serves as the entrypoint for users, providing:
1. Dual forms for User Signup and User Login.
2. Client-side theme switching (Light vs Dark mode) persisting in localStorage.
3. Password visibility toggle (show/hide password input).
4. Fetch-based asynchronous submissions communicating with Flask backend API endpoints.
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Cost Predictor - Welcome</title>
    <!-- Premium Font family selection from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Links to auth.css which handles split layout and theme variables styling -->
    <link rel="stylesheet" href="auth.css">
</head>

<body>
    <!-- 
      Theme Toggle Button
      Allows toggle between light/dark themes by toggling '.dark-theme' class on <body>
    -->
    <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle Theme">
        <!-- SVG icon for Light Mode (Sun) -->
        <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            style="display: none;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 3v1m0 16v1m9-9h-1M4 9H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M14 12a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
        <!-- SVG icon for Dark Mode (Moon) -->
        <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
    </button>

    <!-- Split Screen Main Wrapper Container -->
    <div class="container">
        <!-- Left Panel: Graphic overlay and brand description -->
        <div class="left-panel">
            <div class="overlay"></div>
            <div class="content">
                <h1>Hospital Cost Predictor</h1>
                <p>Empowering you to make informed decisions about healthcare costs. Access accurate predictions
                    instantly.</p>
            </div>
        </div>

        <!-- Right Panel: Authentication Forms box -->
        <div class="right-panel">
            <div class="auth-box">
                <!-- Custom Alert Banner for UI notification messages -->
                <div id="authAlert" class="custom-alert"></div>

                <!-- Tab Toggle Controls (Login vs Sign Up) -->
                <div class="toggle-container">
                    <button class="toggle-btn active" id="btn-login" onclick="switchTab('login')">Login</button>
                    <button class="toggle-btn" id="btn-signup" onclick="switchTab('signup')">Sign Up</button>
                    <!-- Visual slider indicator that moves under the active tab -->
                    <div class="toggle-indicator" id="indicator"></div>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="auth-form active">
                    <h2>Welcome Back</h2>
                    <p class="subtitle">Please sign in to access cost estimates.</p>
                    <div class="input-group">
                        <label for="login-email">Email</label>
                        <div class="input-wrapper">
                            <input type="email" id="login-email" name="email" placeholder="Enter your email" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="login-password">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="login-password" name="password" placeholder="Enter your password"
                                required>
                            <!-- Clickable element to show/hide plaintext password -->
                            <span class="password-toggle-icon" onclick="togglePasswordVisibility('login-password')">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </span>
                        </div>
                    </div>
                    <div class="options">
                        <label class="remember">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#" class="forgot">Forgot Password?</a>
                    </div>
                    <button type="submit" class="primary-btn">Sign In</button>
                </form>

                <!-- Signup Form -->
                <form id="signup-form" class="auth-form">
                    <h2>Create Account</h2>
                    <p class="subtitle">Sign up to get instant transparency ranges.</p>
                    <div class="input-group">
                        <label for="signup-name">Full Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="signup-name" name="name" placeholder="Enter your name" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="signup-email">Email</label>
                        <div class="input-wrapper">
                            <input type="email" id="signup-email" name="email" placeholder="Enter your email" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="signup-password">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="signup-password" name="password" placeholder="Create a password"
                                required>
                            <!-- Clickable element to show/hide plaintext password -->
                            <span class="password-toggle-icon" onclick="togglePasswordVisibility('signup-password')">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </span>
                        </div>
                    </div>
                    <button type="submit" class="primary-btn">Create Account</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Client-side Logic Script -->
    <script>
        // =====================================================================
        // Theme Toggle Manager
        // =====================================================================
        const themeToggleBtn = document.getElementById('themeToggle');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');

        // Check localStorage to apply user's preferred layout theme
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-theme');
            sunIcon.style.display = 'block';
            moonIcon.style.display = 'none';
        } else {
            document.body.classList.remove('dark-theme');
            sunIcon.style.display = 'none';
            moonIcon.style.display = 'block';
        }

        // Toggle stylesheet classes and icons on click
        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            if (isDark) {
                sunIcon.style.display = 'block';
                moonIcon.style.display = 'none';
            } else {
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
            }
        });

        // =====================================================================
        // Alert Banners Helper Functions
        // =====================================================================
        const alertDiv = document.getElementById('authAlert');
        function hideAlert() {
            alertDiv.style.display = 'none';
        }
        function showAlert(msg) {
            alertDiv.textContent = msg;
            alertDiv.style.display = 'block';
        }

        // =====================================================================
        // Tab Navigation Toggle Logic
        // =====================================================================
        function switchTab(tab) {
            hideAlert();
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const indicator = document.getElementById('indicator');
            const btnLogin = document.getElementById('btn-login');
            const btnSignup = document.getElementById('btn-signup');

            if (tab === 'login') {
                loginForm.classList.add('active');
                signupForm.classList.remove('active');
                indicator.style.transform = 'translateX(0)';
                btnLogin.classList.add('active');
                btnSignup.classList.remove('active');
            } else {
                signupForm.classList.add('active');
                loginForm.classList.remove('active');
                indicator.style.transform = 'translateX(100%)';
                btnSignup.classList.add('active');
                btnLogin.classList.remove('active');
            }
        }

        // =====================================================================
        // Password Visibility show/hide logic
        // =====================================================================
        function togglePasswordVisibility(inputId) {
            const passwordInput = document.getElementById(inputId);
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
            } else {
                passwordInput.type = 'password';
            }
        }

        // =====================================================================
        // Sign In Request Submit API Call
        // =====================================================================
        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault(); // Prevent standard page reloads
            hideAlert();

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            // Submit values asynchronously using Fetch API
            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => { throw new Error(err.message || 'Invalid email or password.') });
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.success) {
                        // Redirect to prediction tool dashboard on success
                        window.location.href = '/index.html';
                    } else {
                        showAlert(data.message || 'Invalid email or password.');
                    }
                })
                .catch(err => {
                    console.error('Error:', err);
                    showAlert(err.message);
                });
        });

        // =====================================================================
        // Account Creation (Sign Up) Submit API Call
        // =====================================================================
        document.getElementById('signup-form').addEventListener('submit', function (e) {
            e.preventDefault(); // Prevent page refresh
            hideAlert();

            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, email: email, password: password })
            })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => { throw new Error(err.message || 'Signup failed.') });
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.success) {
                        // Immediately navigate into the index dashboard since signup automatically starts a session
                        window.location.href = '/index.html';
                    } else {
                        showAlert(data.message || 'Account creation failed.');
                    }
                })
                .catch(err => {
                    console.error('Error:', err);
                    showAlert(err.message);
                });
        });
    </script>
</body>

</html>
