                            required>
                    </div>
                    <button type="submit" class="primary-btn">Create Account</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const indicator = document.getElementById('indicator');
            const btnLogin = document.getElementById('btn-login');
            const btnSignup = document.getElementById('btn-signup');

            if (tab === 'login') {
                loginForm.classList.add('active');
                signupForm.classList.remove('active');
                indicator.style.transform = 'translateX(0)';
                btnLogin.classList.add('active');
                btnSignup.classList.remove('active');
            } else {
                signupForm.classList.add('active');
                loginForm.classList.remove('active');
                indicator.style.transform = 'translateX(100%)';
                btnSignup.classList.add('active');
                btnLogin.classList.remove('active');
            }
        }

        // CHANGE HERE: Handle Login form with Flask API
        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = '/index.html'; // Successfully logs in and goes to dashboard
                    } else {
                        alert(data.message); // Shows database errors or wrong password alerts
                    }
                })
                .catch(err => console.error('Error:', err));
        });

        // CHANGE HERE: Handle Signup form with Flask API
        document.getElementById('signup-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, email: email, password: password })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('Registration complete!');
                        window.location.href = '/index.html';
                    } else {
                        alert(data.message);
                    }
                })
                .catch(err => console.error('Error:', err));
        });
    </script>
</body>

</html>
